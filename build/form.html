<form class="quote-form" data-quote-form>
        <div class="form-success" role="status">✓ Sent! We'll get you a fast, fair quote and get you rolling.</div>
        <div class="form-row">
          <div class="field"><label for="{p}-name">Name <b>*</b></label><input id="{p}-name" name="name" type="text" required autocomplete="name"></div>
          <div class="field"><label for="{p}-phone">Phone <b>*</b></label><input id="{p}-phone" name="phone" type="tel" required autocomplete="tel"></div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="{p}-size">Tire size</label>
            <select id="{p}-size" name="tire_size">
              <option value="">Select size…</option>
              <option>185/65R15</option>
              <option>195/65R15</option>
              <option>205/55R16</option>
              <option>205/65R16</option>
              <option>215/55R17</option>
              <option>215/60R16</option>
              <option>215/65R17</option>
              <option>225/45R17</option>
              <option>225/50R17</option>
              <option>225/60R17</option>
              <option>225/65R17</option>
              <option>235/45R18</option>
              <option>235/55R18</option>
              <option>235/60R18</option>
              <option>235/65R17</option>
              <option>245/40R18</option>
              <option>245/45R18</option>
              <option>245/60R18</option>
              <option>245/70R17</option>
              <option>255/50R19</option>
              <option>255/55R18</option>
              <option>255/60R18</option>
              <option>265/60R18</option>
              <option>265/65R17</option>
              <option>265/70R16</option>
              <option>265/70R17</option>
              <option>275/55R20</option>
              <option>275/60R20</option>
              <option>275/65R18</option>
              <option>285/45R22</option>
              <option>285/70R17</option>
              <option>305/35R24</option>
              <option>LT265/75R16</option>
              <option>LT285/75R16</option>
              <option>Not sure / check my tire</option>
            </select>
          </div>
          <div class="field">
            <label for="{p}-year">Year</label>
            <select id="{p}-year" name="year">
              <option value="">Select year…</option>
              <option>2026</option>
              <option>2025</option>
              <option>2024</option>
              <option>2023</option>
              <option>2022</option>
              <option>2021</option>
              <option>2020</option>
              <option>2019</option>
              <option>2018</option>
              <option>2017</option>
              <option>2016</option>
              <option>2015</option>
              <option>2014</option>
              <option>2013</option>
              <option>2012</option>
              <option>2011</option>
              <option>2010</option>
              <option>2009</option>
              <option>2008</option>
              <option>2007</option>
              <option>2006</option>
              <option>2005</option>
              <option>2004</option>
              <option>2003</option>
              <option>2002</option>
              <option>2001</option>
              <option>2000</option>
              <option>1999</option>
              <option>1998</option>
              <option>1997</option>
              <option>1996</option>
              <option>1995</option>
              <option>Older than 1995</option>
            </select>
          </div>
          <div class="field field--full">
            <label for="{p}-model">Car make &amp; model</label>
            <input id="{p}-model" name="model" type="text" placeholder="e.g. Toyota Tacoma SR5">
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="{p}-need">What do you need? <b>*</b></label>
            <select id="{p}-need" name="need" required>
              <option value="">Select…</option>
              <option>New tires</option>
              <option>Rotation / balance</option>
              <option>Alignment</option>
              <option>TPMS</option>
              <option>Flat repair</option>
              <option>General service</option>
              <option>Fleet</option>
              <option>Not sure</option>
            </select>
          </div>
          <div class="field">
            <label for="{p}-when">Preferred day/time</label>
            <input id="{p}-when" name="when" type="text" placeholder="e.g. Saturday morning">
          </div>
        </div>
        <div class="field field--file">
          <label for="{p}-photo">Photo of your tire (optional)</label>
          <label class="filedrop" for="{p}-photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
            <span class="filedrop-text">
              <b>Upload a photo</b>
              <small>Drag &amp; drop, or tap to browse — the sidewall works best</small>
            </span>
            <input id="{p}-photo" name="photo" type="file" accept="image/*">
          </label>
        </div>
        <div class="field"><label for="{p}-msg">Message</label><textarea id="{p}-msg" name="message" placeholder="Anything else we should know?"></textarea></div>
        <button class="btn btn--primary btn--lg" type="submit">Get My Fast Quote <span class="btn-arrow">→</span></button>
        <p class="form-note">Only name and phone are required. We'll text or call you back fast.</p>
      </form>
